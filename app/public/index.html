<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskly</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --text:#e8e8ea; --muted:#8b8f98; --accent:#6ea8fe; --danger:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
    main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 28px; margin: 0 0 16px; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input[type=text] { flex:1; padding:12px; border-radius:8px; border:1px solid #2a2e38; background:var(--card); color:var(--text); font-size:16px; }
    button { padding:10px 14px; border-radius:8px; border:0; background:var(--accent); color:#06101f; font-weight:600; cursor:pointer; }
    .filters { display:flex; gap:8px; margin-bottom:12px; }
    .filters button { background:var(--card); color:var(--muted); }
    .filters button[aria-pressed=true] { background:#243049; color:var(--accent); }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:12px; background:var(--card); padding:12px; border-radius:8px; margin-bottom:8px; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    .title { flex:1; }
    .del { background:transparent; color:var(--danger); font-size:18px; padding:4px 8px; }
    .empty { color:var(--muted); padding:24px; text-align:center; }
  </style>
</head>
<body>
  <main>
    <h1>Taskly</h1>
    <form id="add-form">
      <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <div class="filters" role="group" aria-label="Filter">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="done" aria-pressed="false">Done</button>
    </div>
    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
