<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TicketFix</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2e38; --text:#e8e8ea; --muted:#8b8f98; --accent:#6ea8fe; --ok:#5fd38d; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0; font-size:26px; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:4px 0 20px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:28px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--text); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0; }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button.go { background:var(--accent); color:#06101f; border:0; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label { color:var(--muted); }
  pre#log { background:#0a0c10; border:1px solid var(--line); border-radius:10px; padding:14px; min-height:120px; max-height:420px; overflow:auto; white-space:pre-wrap; font:13px/1.55 ui-monospace, Menlo, monospace; }
  .vids { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin:18px 0; }
  .vids figure { margin:0; background:var(--card); border-radius:10px; padding:10px; }
  .vids figcaption { color:var(--muted); font-size:13px; margin-bottom:6px; }
  video { width:100%; border-radius:6px; background:#000; }
  .verdict { display:inline-block; padding:3px 10px; border-radius:99px; font-weight:600; }
  .verdict.fixed { background:#163323; color:var(--ok); } .verdict.other { background:#3a1a1a; color:var(--bad); }
  #pr { background:var(--card); border-radius:10px; padding:4px 20px 12px; }
  #pr code { background:#0a0c10; padding:1px 5px; border-radius:4px; }
  #pr pre { background:#0a0c10; padding:10px; border-radius:8px; overflow:auto; }
  a { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Ticket<span>Fix</span></h1>
  <p class="sub">Drop a customer's screen recording. Gemini 4 Argon watches it, writes a failing test, fixes the bug, then watches its own fix.</p>

  <div class="drop" id="drop">Drop a .webm / .mp4 recording here, or click to choose<input type="file" id="file" accept="video/webm,video/mp4" hidden /></div>
  <div class="row">
    <label>or a sample ticket <select id="sample"></select></label>
    <label><select id="mode"><option value="real">Real model</option><option value="mock">Mock (canned responses)</option></select></label>
    <label><input type="checkbox" id="open-pr" /> open a GitHub PR</label>
    <button class="go" id="run">Run</button>
  </div>

  <pre id="log">Waiting for a ticket…</pre>

  <section id="result" hidden>
    <p>Verdict: <span id="verdict" class="verdict"></span> <span id="prlink"></span></p>
    <div class="vids">
      <figure><figcaption>Customer recording</figcaption><video id="v-ticket" controls muted></video></figure>
      <figure><figcaption>Before: repro test on the buggy build (fails)</figcaption><video id="v-before" controls muted></video></figure>
      <figure><figcaption>After: same test on the fixed build (passes)</figcaption><video id="v-after" controls muted></video></figure>
    </div>
    <div id="pr"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let file = null;

fetch('/tickets.json').then(r => r.json()).then(list => {
  $('sample').innerHTML = list.map(n => `<option>${n}</option>`).join('');
});

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };
function pick(f) {
  if (!f) return;
  file = f;
  drop.textContent = `🎫 ${f.name} (${(f.size / 1e6).toFixed(1)} MB) — ready`;
}

$('run').onclick = async () => {
  const name = file ? file.name.replace(/[^\w.-]/g, '_') : $('sample').value;
  if (!name) return;
  $('run').disabled = true;
  $('result').hidden = true;
  $('log').textContent = '';
  const q = new URLSearchParams({ name, mode: $('mode').value, pr: $("open-pr").checked ? '1' : '0' });
  let text = '';
  try {
    const res = await fetch('/run?' + q, { method: 'POST', body: file || undefined });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      text += dec.decode(value, { stream: true });
      $('log').textContent = text;
      $('log').scrollTop = $('log').scrollHeight;
    }
    await showResult(name.replace(/\.[^.]+$/, ''), name, text);
  } catch (e) {
    $('log').textContent += `\n${e.message}`;
  }
  $('run').disabled = false;
};

async function showResult(id, name, log) {
  const run = await fetch(`/out/pr/${id}/run.json`).then(r => r.ok ? r.json() : null);
  if (!run) return;
  const bust = '?t=' + Date.now();
  $('v-ticket').src = `/tickets/${name}`;
  $('v-before').src = `/out/pr/${id}/before.webm${bust}`;
  $('v-after').src = `/out/pr/${id}/after.webm${bust}`;
  const v = run.verdict.verdict;
  $('verdict').textContent = v;
  $('verdict').className = 'verdict ' + (v === 'fixed' ? 'fixed' : 'other');
  $('prlink').innerHTML = run.prUrl ? `· <a href="${run.prUrl}" target="_blank" rel="noopener">${run.prUrl}</a>` : '· no PR opened';
  $('pr').innerHTML = md(await fetch(`/out/pr/${id}/PR.md${bust}`).then(r => r.text()));
  $('result').hidden = false;
  $('result').scrollIntoView({ behavior: 'smooth' });
}

// just enough markdown for PR.md: headings, fences, lists, bold, inline code, <details>
function md(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const out = []; let fence = null, list = false;
  for (const line of src.split('\n')) {
    if (line.startsWith('```')) { if (fence) { out.push(`<pre>${esc(fence.join('\n'))}</pre>`); fence = null; } else fence = []; continue; }
    if (fence) { fence.push(line); continue; }
    const li = line.match(/^\s*[-*] (.*)/);
    if (li && !list) { out.push('<ul>'); list = true; }
    if (!li && list) { out.push('</ul>'); list = false; }
    if (li) out.push(`<li>${inline(li[1])}</li>`);
    else if (/^<\/?(details|summary)/.test(line)) out.push(line.replace(/<summary>(.*)<\/summary>/, (_, s) => `<summary>${esc(s)}</summary>`));
    else if (/^#{1,4} /.test(line)) { const n = line.match(/^#+/)[0].length; out.push(`<h${n + 1}>${inline(line.slice(n + 1))}</h${n + 1}>`); }
    else if (/^---\s*$/.test(line)) out.push('<hr />');
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push('</ul>');
  return out.join('\n');
}
</script>
</body>
</html>
